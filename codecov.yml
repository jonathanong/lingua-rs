coverage:
  status:
    project:
      default: off
      rust:
        target: 90%
        threshold: 1%
        require_base: false
        flags:
          - rust
        if_not_found: failure
      js:
        target: 100%
        threshold: 0%
        require_base: false
        flags:
          - js
        if_not_found: failure
    patch:
      default: off
      rust:
        target: 85%
        threshold: 2%
        flags:
          - rust
        if_not_found: failure
      js:
        target: 100%
        threshold: 0%
        flags:
          - js
        if_not_found: failure

flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: rust
      paths:
        - crate/src/
        - crate/tests/
    - name: js
      paths:
        - package/checksums.js
        - package/install-env.js
        - package/postinstall.js
        - package/request.js
        - package/retry.js
        - package/transfer.js
